<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - FitLife Gym</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    /* Basic reset for margin and padding */
body, h1, h2, p, a, img {
    margin: 0;
    padding: 0;
    text-decoration: none;
    color: inherit;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f4f4f4;
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh; /* Ensure the body takes up at least the full viewport height */
}

.header {
    background: #333;
    color: #fff;
    padding: 1rem;
    text-align: center;
    width: 100%; /* Ensure header spans full width */
}

.header h1 {
    margin-bottom: 0.5rem;
}

.main-content {
    flex: 1; /* Make main content take up available space */
    padding: 2rem;
    max-width: 1200px; /* Set a maximum width for content */
    margin: 0 auto; /* Center the content */
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h2 {
    text-align: center;
    margin-bottom: 2rem;
}

.gallery-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
    padding: 1rem;
}

.gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.footer {
    background: #333;
    color: #fff;
    padding: 1rem;
    text-align: center;
    width: 100%; /* Ensure footer spans full width */
}

.footer a {
    color: #fff;
}

.footer a:hover {
    text-decoration: underline;
}

.navigation {
        margin-top: 1rem;
    }

    .navigation a {
        color: #fff;
        margin: 0 1rem;
        font-weight: bold;
    }

    .navigation a:hover {
        text-decoration: underline;
    }
</style>
<body>
    <div class="header">

            <a href="Home.html">Home</a>

            <a href="gallery.html">Gallery</a>

    </div>

    <div class="main-content">
